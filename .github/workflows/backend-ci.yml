name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: survai
          POSTGRES_PASSWORD: survai
          POSTGRES_DB: survai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survai -d survai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff check
        run: ruff check app tests

      - name: Pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://survai:survai@localhost:5432/survai_test
          JWT_SECRET_KEY: ci-test-secret
          CORS_ORIGINS: http://localhost:3000
        run: pytest -q --cov=app --cov-report=term-missing

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t survai-api:ci .
        working-directory: backend
