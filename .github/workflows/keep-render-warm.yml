# Ping Render free-tier API so it doesn't sleep after ~15m idle.
# Cron can drift a few minutes on GitHub's free scheduler — 10m is safer than 14m.
name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Health ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/v1/health
        env:
          # Override via repo Variable RENDER_HEALTH_URL if the host changes.
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://survai-mzam.onrender.com/api/v1/health' }}
        run: |
          set -euo pipefail
          echo "Pinging ${HEALTH_URL}"
          # Free instances may take 30–60s to wake; retry a few times.
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 90 "${HEALTH_URL}"; then
              echo
              echo "OK (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i} failed; retrying in 15s…"
            sleep 15
          done
          echo "Health check failed after retries"
          exit 1
